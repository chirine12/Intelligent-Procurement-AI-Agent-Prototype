{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <h1>No data yet</h1>
  <p>Generate the simulated SAP data and clean it. It runs once and takes a few seconds.</p>
</header>
<form method="post" action="{{ url_for('setup_run') }}" data-busy class="toolbar">
  <button class="btn primary" type="submit">Generate the data</button>
  <span class="busy-msg">Running setup...</span>
</form>
{% endblock %}
