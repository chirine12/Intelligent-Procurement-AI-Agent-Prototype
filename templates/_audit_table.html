<table>
  <thead><tr><th>Time (UTC)</th><th>Event</th><th>PO</th><th>Action / tool</th><th>Decision</th><th>Approver</th><th>Details</th></tr></thead>
  <tbody>
  {% for e in entries %}
    <tr>
      <td style="white-space:nowrap">{{ e.time }}</td>
      <td><span class="tag {{ e.tone }}">{{ e.event }}</span></td>
      <td>{{ e.po }}</td>
      <td>{{ e.subject }}</td>
      <td>{{ e.decision }}</td>
      <td>{{ e.approver }}</td>
      <td><details class="audit-json"><summary>Show JSON</summary><pre>{{ e.details }}</pre></details></td>
    </tr>
  {% else %}
    <tr><td colspan="7">No entry matches these filters.</td></tr>
  {% endfor %}
  </tbody>
</table>
